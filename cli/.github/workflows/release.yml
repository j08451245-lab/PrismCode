name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## PrismCode ${{ github.ref_name }}

            ### Run from source
            ```bash
            git clone https://github.com/j08451245-lab/PrismCode
            cd PrismCode/cli
            bun install
            bun run dev:cli
            ```

            See the [README](https://github.com/j08451245-lab/PrismCode) for full documentation.
